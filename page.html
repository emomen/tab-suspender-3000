<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Window & Tab Manager</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <header style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <h1 style="font-size:16px;margin:0">Window & Tab Manager</h1>
      <div style="display:flex;gap:8px;align-items:center;margin-right:20px;">
        <button id="refreshBtn">Refresh</button>
        <button id="suspendBtn">Suspend selected</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-right:20px;">
        <button id="collapseAllBtn">Collapse all</button>
        <button id="expandAllBtn">Expand all</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="themeToggle" class="theme-toggle" aria-pressed="false">Toggle theme</button>
      </div>
    </header>
    <div id="list"></div>

    <script src="page.js"></script>
  </body>
</html>
